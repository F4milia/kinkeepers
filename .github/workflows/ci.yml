name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Integration tests connect to the local stack (see vitest.config.mts);
      # without this they hang until the 5s per-test timeout and fail.
      - run: supabase start
      # Unconditional on every PR per kinkeepers-testing-workflow.md - this was
      # missing entirely before, so RLS/schema regressions could pass CI green.
      - run: supabase test db
      - run: npm run test
      - run: npm run build
