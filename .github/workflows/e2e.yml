name: E2E

# Path-filtered per kinkeepers-testing-workflow.md: backend-only PRs
# shouldn't wait on browser tests. GitHub simply doesn't trigger this
# workflow at all when none of these paths change - not a same-workflow
# conditional skip, so a backend PR's required checks never include it.
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # playwright.config.ts's webServer runs `next build && next start`,
      # which needs real-looking env vars the same as any Next.js build -
      # this job never had a Supabase stack at all before, so every page
      # load (middleware runs on all of them) failed at
      # "project's URL and Key are required to create a Supabase client."
      # Nothing had ever triggered this workflow to surface it until now
      # (path-filtered to app/**, components/**; this PR is the first to
      # touch app/** since e2e.yml was added). Same local demo keys as
      # vitest.config.mts and ci.yml's `supabase start` - not a secret,
      # only reachable at 127.0.0.1, identical on every local instance.
      - run: supabase start
      - run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54361
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          # Not a real secret - CI only hashes localhost's own IP during
          # these tests, nothing persisted beyond the ephemeral runner.
          AUTH_IP_HASH_SECRET: ci-only-not-a-real-secret-0000000000000000
          # X1's staging-guard now covers requestEmailLink/requestSmsCode
          # too (see lib/messaging/staging-guard.ts's Learned Constraints
          # entry) - without this, e2e/helpers/sign-in.ts's real magic-link
          # sign-in is blocked outright (APP_ENV isn't "production" here),
          # and no email ever reaches Mailpit. @example.com is the one
          # domain IANA reserves for exactly this (RFC 2606), matched by
          # the allowlist's own leading-@ domain-suffix support - never a
          # real caregiver's address.
          STAGING_MESSAGE_ALLOWLIST: "@example.com"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
