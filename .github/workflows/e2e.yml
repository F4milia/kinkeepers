name: E2E

# Path-filtered per kinkeepers-testing-workflow.md: backend-only PRs
# shouldn't wait on browser tests. GitHub simply doesn't trigger this
# workflow at all when none of these paths change - not a same-workflow
# conditional skip, so a backend PR's required checks never include it.
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "e2e/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
